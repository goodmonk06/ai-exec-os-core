version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-exec-os-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_exec_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-exec-os-network

  redis:
    image: redis:7-alpine
    container_name: ai-exec-os-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-exec-os-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-exec-os-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_exec_os
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-exec-os-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ai-exec-os-network:
    driver: bridge
